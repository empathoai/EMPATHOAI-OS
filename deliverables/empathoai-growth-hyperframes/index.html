<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>EmpathoAI Growth Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: local("IBM Plex Sans"); }
      @font-face { font-family: "IBM Plex Mono"; src: local("IBM Plex Mono"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0A0A0B; }
      body { font-family: "IBM Plex Sans", Arial, sans-serif; color: #F5F5F5; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0A0A0B; }
      .clip { position: absolute; inset: 0; }
      .grid { position: absolute; inset: 0; opacity: .36; background-image: linear-gradient(#2D2D2F 1px, transparent 1px), linear-gradient(90deg, #2D2D2F 1px, transparent 1px); background-size: 120px 120px; }
      .rule { position: absolute; left: 120px; right: 120px; height: 1px; background: #2D2D2F; }
      .rule.top { top: 120px; } .rule.bottom { bottom: 120px; }
      .content { position: absolute; left: 120px; top: 310px; width: 1350px; }
      .eyebrow, .index { font-family: "IBM Plex Mono", monospace; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: #8E8E93; }
      h1 { margin: 38px 0 28px; font-size: 164px; line-height: .95; letter-spacing: -.055em; font-weight: 700; }
      .accent { display: inline-block; width: 28px; height: 28px; margin-right: 24px; background: #FF4402; vertical-align: 24px; }
      .subtitle { max-width: 900px; color: #C7C7CC; font-size: 45px; line-height: 1.22; letter-spacing: -.02em; }
      .index { position: absolute; right: 120px; bottom: 152px; color: #FF4402; }
      .signal { position: absolute; right: 190px; top: 250px; width: 310px; height: 310px; border: 1px solid #2D2D2F; border-radius: 50%; }
      .signal:before, .signal:after { content: ""; position: absolute; border: 1px solid #2D2D2F; border-radius: 50%; }
      .signal:before { inset: 42px; } .signal:after { inset: 84px; }
      .dot { position: absolute; width: 14px; height: 14px; background: #FF4402; right: 334px; top: 398px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="empathoai-growth" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="growth-title-scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="grid" class="grid"></div><div id="top-rule" class="rule top"></div><div id="bottom-rule" class="rule bottom"></div>
        <div id="signal" class="signal"></div><div id="dot" class="dot"></div>
        <div class="content"><div id="eyebrow" class="eyebrow">Human depth. Machine leverage.</div><h1 id="title"><span id="accent" class="accent"></span>EmpathoAI</h1><p id="subtitle" class="subtitle">Growth systems that create qualified opportunities.</p></div>
        <div id="index" class="index">01 / Growth</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from('#grid', { opacity: 0, duration: .6, ease: 'power2.out' }, 0)
        .from(['#top-rule', '#bottom-rule'], { scaleX: 0, transformOrigin: 'left center', duration: .7, stagger: .12, ease: 'power3.out' }, .15)
        .from('#eyebrow', { y: 22, opacity: 0, duration: .5, ease: 'power3.out' }, .45)
        .from('#accent', { scale: 0, rotation: -90, duration: .45, ease: 'back.out(1.7)' }, .65)
        .from('#title', { y: 65, opacity: 0, duration: .8, ease: 'power3.out' }, .65)
        .from('#subtitle', { y: 30, opacity: 0, duration: .6, ease: 'power3.out' }, 1.1)
        .from(['#signal', '#dot'], { scale: .4, opacity: 0, duration: .7, stagger: .12, ease: 'power2.out' }, .8)
        .from('#index', { x: 30, opacity: 0, duration: .45, ease: 'power2.out' }, 1.35)
        .to('#signal', { rotation: 12, duration: 2.8, ease: 'power1.inOut' }, 1.5)
        .to('#grid', { opacity: .18, duration: 1.2, ease: 'power1.inOut' }, 3.4);
      window.__timelines['empathoai-growth'] = tl;
    </script>
  </body>
</html>
